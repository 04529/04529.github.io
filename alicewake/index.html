<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALICE WAKE</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>

</head>
<body class="index">
    <div class="hero">
        <img src="./assets/indexHero.png"/>
    </div>

    <div class="pressStart">
        <h1>PRESS <button id="enter">ENTER</button> TO CONTINUE</h1>
        see <button id="credits">credits</button>
        </div>

        <div class="credits">
            <h2>Credits:</h2>
            <div class="credit-item">
                <strong>Fox</strong><br>
                Background photo by Ray Hennessy on <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </div>
            <div class="credit-item">
                <strong>Manuscript</strong><br>
                Background photo by Tyler Moore on <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </div>
            <div class="credit-item">
                <strong>Opening Screen</strong><br>
                Photo by Joshua Hanson on <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </div>
            <div class="credit-item">
                <strong>Spiral</strong><br>
                Photo by Javier Esteban on <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </div>

            <button id="seeYouAlan">see you on the other side ... alan.</button>
        </div>

    <script>
        document.getElementById("enter").addEventListener("click", function() {
            window.location.href = "./chapterSelect.html";
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                window.location.href = "./chapterSelect.html";
            }
        });

        document.getElementById("credits").addEventListener("click", function() {
            const creditsDiv = document.getElementsByClassName("credits")[0];
            creditsDiv.style.bottom = "0%";
        });

        document.getElementById("seeYouAlan").addEventListener("click", function() {
            const creditsDiv = document.getElementsByClassName("credits")[0];
            creditsDiv.style.bottom = "-100%";
        });
    </script>
</body>
</html>
