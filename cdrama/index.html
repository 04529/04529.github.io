<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDRAMA AU</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <style>
            body{
                padding: 0px;
                margin: 0px; 
                background-color: #6B8BBC;
            }
            #map{
                width: 1870px; 
                height: 947px; 
            }
        </style>
</head>

<body>

    <div id="map"></div>

    <script src="./theworld.geojson"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Define the map's coordinate space to match your image's pixel dimensions
        const imageWidth = 1870;
        const imageHeight = 947;

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 4
        });

        const bounds = [[0, 0], [imageHeight, imageWidth]];

        L.imageOverlay('./theworld.svg', bounds).addTo(map);
        map.fitBounds(bounds);
        

    </script>
</body>

</html>
